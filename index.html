<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>67</title>
<style>
:root{
  --bg:#ffe14d; --six:#e8232f; --seven:#1b3cff; --ink:#111;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14121f; --six:#ff5a64; --seven:#5f86ff; --ink:#f5f5f5; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#14121f; --six:#ff5a64; --seven:#5f86ff; --ink:#f5f5f5; color-scheme:dark; }
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; cursor:pointer; user-select:none;
  font-family:"Arial Black","Impact",system-ui,sans-serif;
}
.row{display:flex; gap:2vw; align-items:center; justify-content:center; height:100%}
.n{
  font-size:min(48vw,62vh); line-height:1; font-weight:900;
  animation:bounce var(--t,.5s) ease-in-out infinite alternate;
  will-change:transform;
}
.six{color:var(--six)}
.seven{color:var(--seven); animation-direction:alternate-reverse}
@keyframes bounce{
  from{transform:translateY(-14vh) rotate(-4deg)}
  to{transform:translateY(14vh) rotate(4deg)}
}
@media (prefers-reduced-motion: reduce){
  .n{animation-duration:2s}
}
</style>
</head>
<body>
<div class="row" id="row">
  <div class="n six">6</div>
  <div class="n seven">7</div>
</div>
<script>
(function(){
  var speeds=[.5,.3,.18,.8], i=0, row=document.getElementById('row');
  document.body.addEventListener('click',function(){
    i=(i+1)%speeds.length;
    row.style.setProperty('--t',speeds[i]+'s');
  });
})();
</script>
</body>
</html>
